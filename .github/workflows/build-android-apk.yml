name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets (www/index.html, index.html, manifests)
        run: |
          mkdir -p www
          cp pro_accounting_ledger.html www/index.html
          cp pro_accounting_ledger.html index.html
          cp manifest.json www/manifest.json

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add WhatsApp package visibility queries
        run: |
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          xml = path.read_text(encoding='utf-8')
          queries = (
              '    <queries>\n'
              '        <package android:name="com.whatsapp" />\n'
              '        <package android:name="com.whatsapp.w4b" />\n'
              '    </queries>\n'
          )
          if '<queries>' not in xml:
              xml = xml.replace('</manifest>', queries + '</manifest>', 1)
          path.write_text(xml, encoding='utf-8')
          print(xml)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/pro-accounting-ledger-v2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pro-accounting-ledger-v2
          path: dist/pro-accounting-ledger-v2.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: Pro Ledger v2 (build ${{ github.run_number }})
          files: dist/pro-accounting-ledger-v2.apk
          generate_release_notes: true

      - name: Stage GitHub Pages site
        run: |
          mkdir -p site
          cp www/index.html site/index.html
          cp www/manifest.json site/manifest.json
          cp dist/pro-accounting-ledger-v2.apk site/pro-accounting-ledger-v2.apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
